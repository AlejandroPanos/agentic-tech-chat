[project]
name = "backend"
version = "0.1.0"
description = "The backend for the agentic chat application"
readme = "README.md"
authors = [
    { name = "Alejandro Paños" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pytest>=9.2.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
